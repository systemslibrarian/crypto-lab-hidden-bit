name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and correctness gate
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and claims gate
        run: npm run test:a11y
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ── B: the rule only gates if it can block ────────────────────────────────
  # Verdict coverage is its own required check, and BOTH deploy and the
  # dependabot auto-merge take `needs:` on it. Auto-merge waits only on required
  # checks and a direct push to main skips PR checks entirely, so a gate that
  # merely runs is decoration: this one sits between every trigger and the
  # Pages deployment, including a direct push to main.
  verdict-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Coverage is derived by walking the RENDERED page, never from an
      # enumeration of exhibits: fails on a [data-verdict] marker with no
      # mutation in mutations/registry.json, and fails on verdict words or
      # verdict styling rendered outside a marker.
      - name: Verdict coverage gate
        run: npm run test:verdicts
      # §4.1c. Every marker's mutation must be KILLED: unmutated baseline
      # passing in the same run, and the failure being that verdict's own
      # assertion rather than a build error, a blank page or a timeout.
      - name: Verdict mutation sweep
        run: npm run test:mutations

  deploy:
    needs: [build, verdict-coverage]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    needs: [build, verdict-coverage]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose complete gate passed
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15
          done
          [[ -n "$merged" ]] || { echo "::warning::gate passed, merge did not land"; exit 0; }
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}